[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcia-kernel"
version = "0.1.0"
description = "ORCIA Shared Kernel — Pure UUIDv7, Enums, Domain Errors, Transactional Outbox Events & Hexagonal Ports (0 business domain or framework dependencies)"
requires-python = ">=3.12"
dependencies = [
    "uuid-utils>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
