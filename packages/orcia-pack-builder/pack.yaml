pack_id: "orcia://packs/orcia-pack-builder"
pack_slug: "pack-builder"
version: "0.1.0"
title: "Atelier Système de Packs Métiers (orcia-pack-builder)"
domain: "SYSTEM_PACK_BUILDER"
human_anchor_required: true
agents:
  - slug: "architecte-metier-pack"
    handle: "@Architecte-Métier-Pack"
    role: "Structuration de la chaîne causale ADN (DIRECTIVE ➔ NORME ➔ MÉCANISME), du glossaire socle et des profils humains"
  - slug: "ingenieur-prompt-et-workflow"
    handle: "@Ingénieur-Prompt-et-Workflow"
    role: "Conception des agents spécialisés, des graphes DAG DBOS et des Gates d'arbitrage"
  - slug: "certificateur-securite-et-sandbox"
    handle: "@Certificateur-Sécurité-et-Sandbox"
    role: "Compilation et certification des règles Starlark Palier 1b (< 2 ms) et audit des outils lourds en Sandbox Palier 2"
  - slug: "redacteur-documentation-orcia"
    handle: "@Rédacteur-Documentation-Orcia"
    role: "Rédaction bilingue (fr/en) des fiches HelpArticle et validation déterministe validate_help_article (< 5 s)"
processes:
  - slug: "create-business-pack"
    uri: "orcia://pack-builder/workflows/create-business-pack"
    title: "Processus 1 — Créer un Pack Métier de A à Z"
  - slug: "evolve-business-pack"
    uri: "orcia://pack-builder/workflows/evolve-business-pack"
    title: "Processus 2 — Faire évoluer un Pack Métier (Simulation What-If)"
  - slug: "certify-pack-tool"
    uri: "orcia://pack-builder/workflows/certify-pack-tool"
    title: "Processus 3 — Certifier une Règle Starlark (Palier 1b) ou un Outil (Palier 2)"
  - slug: "export-from-workspace-to-pack"
    uri: "orcia://pack-builder/workflows/export-from-workspace-to-pack"
    title: "Processus 4 — Promouvoir une Brique d'un Espace vers un Pack Partagé"
  - slug: "generate-and-attach-help"
    uri: "orcia://pack-builder/workflows/generate-and-attach-help"
    title: "Processus 5 — Générer, Valider et Rattacher à Chaud les Fiches d'Aide (HelpArticle)"
