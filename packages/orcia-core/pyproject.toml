[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcia-core"
version = "0.1.0"
description = "ORCIA Core — Hexagonal Bounded Contexts & Domain Services (AD-19)"
requires-python = ">=3.12"
dependencies = [
    "orcia-kernel>=0.1.0",
    "pydantic>=2.11.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "uuid-utils>=0.9.0",
]

[project.entry-points."orcia.uri_resolvers"]
git = "orcia_core.bootstrap.plugin_registry:resolve_git_scheme_plugin"
jira = "orcia_core.bootstrap.plugin_registry:resolve_jira_scheme_plugin"
confluence = "orcia_core.bootstrap.plugin_registry:resolve_confluence_scheme_plugin"
db = "orcia_core.bootstrap.plugin_registry:resolve_db_scheme_plugin"
nexus = "orcia_core.bootstrap.plugin_registry:resolve_nexus_scheme_plugin"
orcia = "orcia_core.bootstrap.plugin_registry:resolve_orcia_scheme_plugin"

[project.entry-points."orcia.llm_gateways"]
litellm = "orcia_core.bootstrap.plugin_registry:build_litellm_gateway_plugin"
cassette = "orcia_core.bootstrap.plugin_registry:build_cassette_gateway_plugin"

[project.entry-points."orcia.step_executors"]
AGENT = "orcia_core.orchestration.step_executors:build_agent_step_executor_plugin"
SKILL = "orcia_core.orchestration.step_executors:build_skill_step_executor_plugin"
SUB_WORKFLOW = "orcia_core.orchestration.step_executors:build_sub_workflow_step_executor_plugin"
HUMAN_TASK = "orcia_core.orchestration.step_executors:build_human_task_step_executor_plugin"
HTTP_ACTION = "orcia_core.orchestration.step_executors:build_http_action_step_executor_plugin"
POST_ACTION_VERIFICATION = "orcia_core.orchestration.step_executors:build_post_action_step_executor_plugin"

[tool.setuptools.packages.find]
where = ["src"]
