# Team overrides for bmad-build-auto — Direct Spec-to-TLR Unification & Subagent Routing

[workflow]
activation_steps_prepend = [
  "SINGLE COMMITTED ARTIFACT (TECH LEAD REPORT): Do NOT create any new `spec-*.md` file. Set `spec_file` directly to `docs/implementation-artifacts/tech-lead-reports/<story-key>-tech-lead-report.md` (or `<YYYY-MM-DD>-<slug>-tech-lead-report.md` for ad-hoc work) using `docs/implementation-artifacts/TECH-LEAD-REPORT-TEMPLATE.md` (HTML-comment frozen §1, YAML frontmatter resume state, §2 `- [ ]` tasks). Never read/edit `tech-lead-reports/README.md`.",
]

persistent_facts = []

implementation_handoff = """
Invoke subagent `bmad-dev-worker` (`model: flash`, no prior conversation context) with this prompt:

> Read `{spec_file}` (the story's Tech Lead Report §1–§2) and implement it — frozen §1 and §2 tasks are the sole source of truth. Load `docs/agent-playbooks/coder.md` and only needed layer playbooks (`docs/agent-playbooks/layers/{backend,frontend}.md`) in bounded line ranges. Write `.agent_check/story_intent.md` (< 500 tokens) strictly for `bmad-fixer-worker`.
>
> Fail-Fast rule (`R-ROUTE-03`): if compilation, linter, typechecker, or tests fail twice in a row on the same root cause, stop immediately and return a 3-point diagnostic for `pro` escalation.
>
> When done, report modified file paths, exact verification commands/results, and open risks.
"""
