[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcia-monorepo"
version = "0.1.0"
description = "ORCIA — Orchestration of Processes, Context, and Intelligent Agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "orjson>=3.10.0",
    "uuid-utils>=0.9.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "dramatiq[redis]>=1.17.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.115.0",
    "testcontainers[postgres,redis,minio]>=4.8.0",
    "schemathesis>=3.38.0",
]

[tool.setuptools.package-dir]
"" = "packages/orcia-core/src"
orcia_api = "apps/api/src/orcia_api"
orcia_worker = "apps/worker/src/orcia_worker"

[tool.setuptools.packages.find]
where = ["packages/orcia-core/src", "apps/api/src", "apps/worker/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/orcia-core/src", "apps/api/src", "apps/worker/src", "tests", "infra", "scripts"]
extend-exclude = [".agent", "_bmad", ".venv", "node_modules", ".gitnexus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "packages/orcia-core/src",
    "apps/api/src",
    "apps/worker/src",
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "dramatiq.*",
    "uuid_utils.*",
    "testcontainers.*",
    "schemathesis.*",
    "alembic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
    "packages/orcia-core/src",
    "apps/api/src",
    "apps/worker/src",
    ".",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
