[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcia-monorepo"
version = "0.1.0"
description = "ORCIA — Orchestration of Processes, Context, and Intelligent Agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.11.0",
    "orjson>=3.10.0",
    "uuid-utils>=0.9.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "dramatiq[redis]>=1.17.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.115.0",
    "testcontainers[postgres,redis,minio]>=4.8.0",
    "schemathesis>=3.38.0",
    "import-linter>=2.1",
]

[tool.uv.workspace]
members = [
    "packages/orcia-core",
    "packages/orcia-connectors",
    "apps/api",
    "apps/worker",
]

[tool.uv.sources]
orcia-core = { workspace = true }
orcia-connectors = { workspace = true }
orcia-api = { workspace = true }
orcia-worker = { workspace = true }

[tool.setuptools.package-dir]
orcia_kernel = "packages/orcia-core/src/orcia_kernel"
orcia_core = "packages/orcia-core/src/orcia_core"
orcia_connectors = "packages/orcia-connectors/src/orcia_connectors"
orcia_pack_sdlc = "packages/orcia-connectors/src/orcia_pack_sdlc"
orcia_pack_builder = "packages/orcia-connectors/src/orcia_pack_builder"
orcia_api = "apps/api/src/orcia_api"
orcia_worker = "apps/worker/src/orcia_worker"

[tool.setuptools.packages.find]
where = [
    "packages/orcia-core/src",
    "packages/orcia-connectors/src",
    "apps/api/src",
    "apps/worker/src",
]

[project.entry-points."orcia.packs"]
pack_builder = "orcia_pack_builder:get_pack_builder_manifest"

[project.entry-points."orcia.connectors"]
git = "orcia_pack_sdlc.connectors:create_git_connector"
jira = "orcia_pack_sdlc.connectors:create_jira_connector"
confluence = "orcia_pack_sdlc.connectors:create_confluence_connector"
nexus = "orcia_pack_sdlc.connectors:create_nexus_connector"

[project.entry-points."orcia.workflow_policies"]
sdlc_fr13 = "orcia_pack_sdlc.policies:create_sdlc_fr13_policy_plugin"

[project.entry-points."orcia.memlog_markers"]
sdlc_markers = "orcia_pack_sdlc.markers:create_sdlc_memlog_marker_plugin"

[project.entry-points."orcia.catalog_formats"]
bmad_pack = "orcia_pack_sdlc.formats_and_indexers:get_bmad_pack_format_adapter"

[project.entry-points."orcia.indexers"]
code_ast = "orcia_pack_sdlc.formats_and_indexers:get_git_code_ast_indexer"
jira_hybrid = "orcia_pack_sdlc.formats_and_indexers:get_jira_hybrid_indexer"
tripartite_graph = "orcia_pack_sdlc.formats_and_indexers:get_tripartite_graph_indexer"

[tool.importlinter]
root_packages = [
    "orcia_core",
    "orcia_connectors",
    "orcia_api",
    "orcia_worker",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AD-19 Contract 1: Unidirectional Package Layers (api/worker -> connectors -> core)"
type = "layers"
layers = [
    "orcia_api | orcia_worker",
    "orcia_connectors",
    "orcia_core",
]

[[tool.importlinter.contracts]]
name = "AD-19 Contract 2: Acyclic Domain Hierarchy in orcia_core (zero circular dependencies)"
type = "layers"
containers = ["orcia_core"]
layers = [
    "bootstrap | orchestration | packs | agents",
    "blackboard | ontology | rag | gates | audit_finops | workflows",
    "catalog",
    "permissions",
    "domain | ports | config | observability | storage",
    "kernel",
]

[[tool.importlinter.contracts]]
name = "AD-19 Contract 3: Pure Hexagonal Kernel & Core Domain/Ports (zero framework/SDK imports)"
type = "forbidden"
source_modules = [
    "orcia_core.kernel",
    "orcia_core.domain",
    "orcia_core.ports",
]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "dramatiq",
    "dbos",
    "redis",
    "litellm",
    "docling",
    "wasmtime",
    "orcia_api",
    "orcia_worker",
    "orcia_connectors",
]

[[tool.importlinter.contracts]]
name = "AD-20 Contract 4: orcia_core never imports orcia_connectors"
type = "forbidden"
source_modules = [
    "orcia_core",
]
forbidden_modules = [
    "orcia_connectors",
]

[[tool.importlinter.contracts]]
name = "AD-19 Contract 5: API and Orchestration never import docling (Story 4.1a)"
type = "forbidden"
source_modules = [
    "orcia_api",
    "orcia_core.orchestration",
    "orcia_worker.dbos_workflow_runner",
    "orcia_worker.outbox_relay",
]
forbidden_modules = [
    "docling",
    "orcia_worker.docling_indexer",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/orcia-core/src",
    "packages/orcia-connectors/src",
    "apps/api/src",
    "apps/worker/src",
    "tests",
    "infra",
    "scripts",
]
extend-exclude = [".agent", "_bmad", ".venv", "node_modules", ".gitnexus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx.Client".msg = "Interdit dans l'event loop ASGI : utiliser `httpx.AsyncClient` (`request.app.state.http_client`)."
"requests".msg = "Interdit dans ORCIA : utiliser `httpx.AsyncClient` non bloquant."
"urllib.request".msg = "Interdit dans ORCIA : utiliser `httpx.AsyncClient` non bloquant."

[tool.ruff.lint.per-file-ignores]
"packages/orcia-core/src/orcia_core/catalog/_internal/seaweedfs_adapter.py" = ["TID251"]
"tests/**" = ["TID251"]
"infra/**" = ["TID251"]
"scripts/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "packages/orcia-core/src",
    "packages/orcia-connectors/src",
    "apps/api/src",
    "apps/worker/src",
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "dramatiq.*",
    "uuid_utils.*",
    "testcontainers.*",
    "schemathesis.*",
    "alembic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
    "packages/orcia-core/src",
    "packages/orcia-connectors/src",
    "apps/api/src",
    "apps/worker/src",
    ".",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
