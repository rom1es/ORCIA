[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcia-monorepo"
version = "0.1.0"
description = "ORCIA — Orchestration of Processes, Context, and Intelligent Agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.11.0",
    "orjson>=3.10.0",
    "uuid-utils>=0.9.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "dramatiq[redis]>=1.17.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.115.0",
    "testcontainers[postgres,redis,minio]>=4.8.0",
    "schemathesis>=3.38.0",
    "import-linter>=2.1",
]

[tool.uv.workspace]
members = [
    "packages/orcia-kernel",
    "packages/orcia-core",
    "apps/api",
    "apps/worker",
]

[tool.uv.sources]
orcia-kernel = { workspace = true }
orcia-core = { workspace = true }
orcia-api = { workspace = true }
orcia-worker = { workspace = true }

[tool.setuptools.package-dir]
orcia_kernel = "packages/orcia-kernel/src/orcia_kernel"
orcia_core = "packages/orcia-core/src/orcia_core"
orcia_api = "apps/api/src/orcia_api"
orcia_worker = "apps/worker/src/orcia_worker"

[tool.setuptools.packages.find]
where = [
    "packages/orcia-kernel/src",
    "packages/orcia-core/src",
    "apps/api/src",
    "apps/worker/src",
]

[tool.importlinter]
root_packages = [
    "orcia_kernel",
    "orcia_core",
    "orcia_api",
    "orcia_worker",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AD-19 Contract 1: Unidirectional Package Layers (api/worker -> core -> kernel)"
type = "layers"
layers = [
    "orcia_api | orcia_worker",
    "orcia_core",
    "orcia_kernel",
]

[[tool.importlinter.contracts]]
name = "AD-19 Contract 2: Acyclic Domain Hierarchy in orcia_core (zero circular dependencies)"
type = "layers"
containers = ["orcia_core"]
layers = [
    "bootstrap | orchestration",
    "blackboard | ontology | rag | gates | audit_finops",
    "catalog",
    "permissions",
    "domain | ports | config | observability",
]

[[tool.importlinter.contracts]]
name = "AD-19 Contract 3: Pure Hexagonal Kernel & Core Domain/Ports (zero framework/SDK imports)"
type = "forbidden"
source_modules = [
    "orcia_kernel",
    "orcia_core.domain",
    "orcia_core.ports",
]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "dramatiq",
    "dbos",
    "redis",
    "litellm",
    "docling",
    "wasmtime",
    "orcia_api",
    "orcia_worker",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/orcia-kernel/src",
    "packages/orcia-core/src",
    "apps/api/src",
    "apps/worker/src",
    "tests",
    "infra",
    "scripts",
]
extend-exclude = [".agent", "_bmad", ".venv", "node_modules", ".gitnexus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
    "packages/orcia-kernel/src",
    "packages/orcia-core/src",
    "apps/api/src",
    "apps/worker/src",
]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "dramatiq.*",
    "uuid_utils.*",
    "testcontainers.*",
    "schemathesis.*",
    "alembic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
    "packages/orcia-kernel/src",
    "packages/orcia-core/src",
    "apps/api/src",
    "apps/worker/src",
    ".",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
