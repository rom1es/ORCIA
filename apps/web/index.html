<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORCIA — Orchestration of Processes, Context, and Intelligent Agents</title>
    <meta
      name="description"
      content="Human-Led, Agent-Accelerated Enterprise Process & Context Orchestration"
    />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("orcia_theme") || "light";
          var locale = window.localStorage.getItem("orcia_locale") || "fr";
          document.documentElement.dataset.theme = theme;
          document.documentElement.lang = locale;
        } catch (_err) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.lang = "fr";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
