name: orcia-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: orcia-postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orcia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcia_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orcia}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - orcia_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orcia} -d ${POSTGRES_DB:-orcia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    container_name: orcia-redis
    restart: unless-stopped
    env_file:
      - ../../.env
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - orcia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.17
    container_name: orcia-seaweedfs
    restart: unless-stopped
    env_file:
      - ../../.env
    command: "server -s3 -s3.port=9000 -ip.bind=0.0.0.0 -dir=/data"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-orcia_seaweed}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-orcia_seaweed_secret}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${SEAWEED_MASTER_PORT:-9333}:9333"
    volumes:
      - orcia_seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: orcia-backend:latest
    container_name: orcia-api
    profiles: ["app-roles"]
    env_file:
      - ../../.env
    environment:
      ORCIA_DEPLOYMENT_ROLE: "api"
      ORCIA_DOCLING_ENABLED: "false"
    command: ["uvicorn", "orcia_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - postgres
      - redis
      - seaweedfs

  worker-orchestration:
    image: orcia-backend:latest
    container_name: orcia-worker-orchestration
    profiles: ["app-roles"]
    env_file:
      - ../../.env
    environment:
      ORCIA_DEPLOYMENT_ROLE: "worker-orchestration"
      ORCIA_DOCLING_ENABLED: "false"
    command: ["python", "-m", "orcia_worker.roles", "--role", "worker-orchestration"]
    depends_on:
      - postgres
      - redis
      - seaweedfs

  worker-indexing:
    image: orcia-backend:latest
    container_name: orcia-worker-indexing
    profiles: ["app-roles"]
    env_file:
      - ../../.env
    environment:
      ORCIA_DEPLOYMENT_ROLE: "worker-indexing"
      ORCIA_DOCLING_ENABLED: "true"
      ORCIA_WORKER_EXTRA: "orcia-worker[indexing]"
    command: ["dramatiq", "orcia_worker.docling_indexer", "--queues", "indexing"]
    depends_on:
      - postgres
      - redis
      - seaweedfs

  trigger-dispatcher:
    image: orcia-backend:latest
    container_name: orcia-trigger-dispatcher
    profiles: ["app-roles"]
    env_file:
      - ../../.env
    environment:
      ORCIA_DEPLOYMENT_ROLE: "trigger-dispatcher"
      ORCIA_DOCLING_ENABLED: "false"
    command: ["python", "-m", "orcia_worker.roles", "--role", "trigger-dispatcher"]
    depends_on:
      - postgres
      - redis

  sandbox-runner:
    image: orcia-backend:latest
    container_name: orcia-sandbox-runner
    profiles: ["app-roles"]
    env_file:
      - ../../.env
    environment:
      ORCIA_DEPLOYMENT_ROLE: "sandbox-runner"
      ORCIA_DOCLING_ENABLED: "false"
      ORCIA_SANDBOX_TIERS: "TIER_1_WASM,TIER_2_CONTAINER"
    command: ["python", "-m", "orcia_worker.roles", "--role", "sandbox-runner"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

volumes:
  orcia_pg_data:
  orcia_redis_data:
  orcia_seaweedfs_data:
