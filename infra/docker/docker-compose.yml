name: orcia-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: orcia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orcia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcia_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orcia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orcia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orcia} -d ${POSTGRES_DB:-orcia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    container_name: orcia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - orcia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: orcia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orcia_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orcia_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - orcia_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orcia_pg_data:
  orcia_redis_data:
  orcia_minio_data:
