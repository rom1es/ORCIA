name: orcia-dev

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: orcia-postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orcia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcia_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orcia}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - orcia_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orcia} -d ${POSTGRES_DB:-orcia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    container_name: orcia-redis
    restart: unless-stopped
    env_file:
      - ../../.env
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - orcia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.17
    container_name: orcia-seaweedfs
    restart: unless-stopped
    env_file:
      - ../../.env
    command: "server -s3 -s3.port=9000 -ip.bind=0.0.0.0 -dir=/data"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-orcia_seaweed}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-orcia_seaweed_secret}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${SEAWEED_MASTER_PORT:-9333}:9333"
    volumes:
      - orcia_seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: orcia-backend:latest
    container_name: orcia-api
    profiles: ["app-roles"]
    user: "10001:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging: *default-logging
    env_file:
      - ../../.env
    networks:
      - default
      - codegraph-internal
    environment:
      ORCIA_DEPLOYMENT_ROLE: "api"
      ORCIA_DOCLING_ENABLED: "false"
      CODEGRAPH_MCP_ENDPOINT: http://gitnexus-mcp:8095/mcp
      CODEGRAPH_PROVIDER: ${CODEGRAPH_PROVIDER:-gitnexus}
      ORCIA_CODEGRAPH_INTERNAL_TOKEN: ${ORCIA_CODEGRAPH_INTERNAL_TOKEN:-orcia-internal-codegraph-token}
    command: ["uvicorn", "orcia_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      - postgres
      - redis
      - seaweedfs

  worker-orchestration:
    image: orcia-backend:latest
    container_name: orcia-worker-orchestration
    profiles: ["app-roles"]
    user: "10001:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging: *default-logging
    env_file:
      - ../../.env
    networks:
      - default
      - codegraph-internal
    environment:
      ORCIA_DEPLOYMENT_ROLE: "worker-orchestration"
      ORCIA_DOCLING_ENABLED: "false"
      CODEGRAPH_MCP_ENDPOINT: http://gitnexus-mcp:8095/mcp
      CODEGRAPH_PROVIDER: ${CODEGRAPH_PROVIDER:-gitnexus}
      ORCIA_CODEGRAPH_INTERNAL_TOKEN: ${ORCIA_CODEGRAPH_INTERNAL_TOKEN:-orcia-internal-codegraph-token}
    command: ["python", "-m", "orcia_worker.roles", "--role", "worker-orchestration", "--serve"]
    depends_on:
      - postgres
      - redis
      - seaweedfs

  worker-indexing:
    image: orcia-backend:latest
    container_name: orcia-worker-indexing
    profiles: ["app-roles"]
    user: "10001:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging: *default-logging
    env_file:
      - ../../.env
    environment:
      ORCIA_DEPLOYMENT_ROLE: "worker-indexing"
      ORCIA_DOCLING_ENABLED: "true"
      ORCIA_WORKER_EXTRA: "orcia-worker[indexing]"
      GITNEXUS_STORAGE_ROOT: /data/graphs
      GITNEXUS_CONTENT_RETENTION: symbol
    command: ["dramatiq", "orcia_worker.docling_indexer", "--queues", "indexing"]
    volumes:
      - gitnexus_graphs:/data/graphs
    depends_on:
      - postgres
      - redis
      - seaweedfs

  gitnexus-mcp:
    image: ghcr.io/abhigyanpatwari/gitnexus:latest
    container_name: orcia-gitnexus-mcp
    restart: unless-stopped
    command: ["mcp", "--http", "--port", "8095"]
    volumes:
      - gitnexus_graphs:/data/graphs:ro
    networks:
      - codegraph-internal
    environment:
      GITNEXUS_STORAGE_ROOT: /data/graphs
      GITNEXUS_CONTENT_RETENTION: symbol
      ORCIA_CODEGRAPH_INTERNAL_TOKEN: ${ORCIA_CODEGRAPH_INTERNAL_TOKEN:-orcia-internal-codegraph-token}
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8095/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  trigger-dispatcher:
    image: orcia-backend:latest
    container_name: orcia-trigger-dispatcher
    profiles: ["app-roles"]
    user: "10001:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging: *default-logging
    env_file:
      - ../../.env
    environment:
      ORCIA_DEPLOYMENT_ROLE: "trigger-dispatcher"
      ORCIA_DOCLING_ENABLED: "false"
    command: ["python", "-m", "orcia_worker.roles", "--role", "trigger-dispatcher", "--serve"]
    depends_on:
      - postgres
      - redis

  sandbox-runner:
    image: orcia-backend:latest
    container_name: orcia-sandbox-runner
    profiles: ["app-roles"]
    user: "10001:0"
    logging: *default-logging
    env_file:
      - ../../.env
    environment:
      ORCIA_DEPLOYMENT_ROLE: "sandbox-runner"
      ORCIA_DOCLING_ENABLED: "false"
      ORCIA_SANDBOX_TIERS: "TIER_1_WASM,TIER_2_CONTAINER"
      ORCIA_SANDBOX_HOST: "0.0.0.0"
      ORCIA_SANDBOX_PORT: "8096"
    command: ["python", "-m", "orcia_worker.roles", "--role", "sandbox-runner", "--serve"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: orcia-opensearch
    profiles: ["logs-elastic"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - orcia_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.4.1
    container_name: orcia-loki
    profiles: ["logs-loki"]
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_PORT:-3101}:3100"
    volumes:
      - orcia_loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.1
    container_name: orcia-grafana
    profiles: ["logs-elastic", "logs-loki"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-orcia_dev_grafana}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - orcia_grafana_data:/var/lib/grafana

volumes:
  orcia_pg_data:
  orcia_redis_data:
  orcia_seaweedfs_data:
  gitnexus_graphs:
  orcia_opensearch_data:
  orcia_loki_data:
  orcia_grafana_data:

networks:
  default:
  codegraph-internal:
    internal: true
