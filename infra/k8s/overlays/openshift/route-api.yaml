apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: orcia-api
  annotations:
    haproxy.router.openshift.io/timeout: "120s"
spec:
  path: /api
  to:
    kind: Service
    name: orcia-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
