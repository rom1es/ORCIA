apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: orcia-web
  annotations:
    haproxy.router.openshift.io/hsts_header: "max-age=31536000;includeSubDomains"
spec:
  to:
    kind: Service
    name: orcia-web
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
