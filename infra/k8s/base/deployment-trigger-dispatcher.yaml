apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcia-trigger-dispatcher
  labels:
    app.kubernetes.io/name: orcia-trigger-dispatcher
    app.kubernetes.io/component: trigger-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: trigger-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcia-trigger-dispatcher
        app.kubernetes.io/component: trigger-dispatcher
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trigger-dispatcher
          image: orcia-backend:latest
          args: ["python", "-m", "orcia_worker.roles", "--role", "trigger-dispatcher", "--serve"]
          envFrom:
            - configMapRef:
                name: orcia-platform-config
            - secretRef:
                name: orcia-runtime-secrets-template
                optional: true
          env:
            - name: ORCIA_DEPLOYMENT_ROLE
              value: "trigger-dispatcher"
            - name: ORCIA_WORKER_ROLE
              value: "trigger-dispatcher"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
