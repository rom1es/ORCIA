apiVersion: v1
kind: ConfigMap
metadata:
  name: orcia-platform-config
data:
  ORCIA_ENV: "production"
  ORCIA_VERSION: "0.1.0"
  LOG_LEVEL: "INFO"
  LOG_SINK_BACKEND: "elasticsearch"
  LOG_COLLECTOR: "clusterlogforwarder"
  ORCIA_LOG_SINK_URL: "https://opensearch-logs.openshift-logging.svc:9200"
  ORCIA_LOG_SINK_INDEX: "app-orcia-*"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc:4318"
  ORCIA_DOCLING_ENABLED: "false"
  ORCIA_SANDBOX_HOST: "0.0.0.0"
  ORCIA_SANDBOX_PORT: "8096"
  ORCIA_SANDBOX_TMP_DIR: "/tmp"
  ORCIA_SANDBOX_TIERS: "TIER_1_WASM,TIER_2_CONTAINER"
  HOME: "/tmp"
  TMPDIR: "/tmp"
