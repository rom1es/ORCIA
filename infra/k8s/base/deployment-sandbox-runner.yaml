apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcia-sandbox-runner
  labels:
    app.kubernetes.io/name: orcia-sandbox-runner
    app.kubernetes.io/component: sandbox-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: sandbox-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcia-sandbox-runner
        app.kubernetes.io/component: sandbox-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox-runner
          image: orcia-backend:latest
          args: ["python", "-m", "orcia_worker.roles", "--role", "sandbox-runner", "--serve"]
          ports:
            - name: sandbox-http
              containerPort: 8096
          envFrom:
            - configMapRef:
                name: orcia-platform-config
            - secretRef:
                name: orcia-runtime-secrets-template
                optional: true
          env:
            - name: ORCIA_DEPLOYMENT_ROLE
              value: "sandbox-runner"
            - name: ORCIA_WORKER_ROLE
              value: "sandbox-runner"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: sandbox-http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: sandbox-http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
