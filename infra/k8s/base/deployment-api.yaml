apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcia-api
  labels:
    app.kubernetes.io/name: orcia-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcia-api
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: orcia-backend:latest
          args: ["uvicorn", "orcia_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: orcia-platform-config
            - secretRef:
                name: orcia-runtime-secrets-template
                optional: true
          env:
            - name: ORCIA_DEPLOYMENT_ROLE
              value: "api"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
