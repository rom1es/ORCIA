# Isolation stricte de sandbox-runner (zéro egress réseau).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orcia-sandbox-runner-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sandbox-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["api", "worker-orchestration"]
      ports:
        - protocol: TCP
          port: 8096
  egress: []
