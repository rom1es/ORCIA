apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcia-worker-orchestration
  labels:
    app.kubernetes.io/name: orcia-worker-orchestration
    app.kubernetes.io/component: worker-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker-orchestration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orcia-worker-orchestration
        app.kubernetes.io/component: worker-orchestration
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-orchestration
          image: orcia-backend:latest
          args: ["python", "-m", "orcia_worker.roles", "--role", "worker-orchestration", "--serve"]
          envFrom:
            - configMapRef:
                name: orcia-platform-config
            - secretRef:
                name: orcia-runtime-secrets-template
                optional: true
          env:
            - name: ORCIA_DEPLOYMENT_ROLE
              value: "worker-orchestration"
            - name: ORCIA_WORKER_ROLE
              value: "worker-orchestration"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
