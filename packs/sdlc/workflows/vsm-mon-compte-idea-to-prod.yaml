- node_type: passage
  id: restitution-archi
  phase_id: '01'
  short_title: Restitution · comité d’archi · RSSI
  title: Restitution d’équipe, comité d’architecture, RSSI
  description: 'Deux instances distinctes. La restitution d’équipe est systématique
    côté Mon Compte : l’architecte présente son étude à l’ensemble de l’équipe impliquée.
    Le comité d’architecture réunit les architectes de la branche, sans l’équipe produit,
    et n’est pas systématique : sans changement d’architecture il n’y a qu’une information,
    un changement mineur se traite en peer review, un changement impactant l’écosystème
    passe en comité et son no-go est bloquant. Le RSSI intervient selon la sensibilité.'
  approver_rbac_roles:
  - sdlc:committee
  - sdlc:architect
  - sdlc:po
  sla_timeout_hours: 72
  human_mandatory_rationale: Une étude engage des mois de développement. La restitution
    est le moment où l’équipe se pose les questions restées ouvertes, et elle peut
    conduire à un no-go. L’arbitrage du niveau de validation requis reste à un architecte.
  ai_assistable_scope: 'Produire le dossier au gabarit, la synthèse des écarts au
    standard, et une recommandation de niveau une fois les critères écrits : information,
    peer review ou comité.'
  delegable_long_term: Non sur la décision. Le contrôle de conformité au formalisme,
    en revanche, peut être automatisé.
  note: 'Aujourd’hui, une étude n’est pas bornée dans le temps : un sujet est resté
    près d’un an à ce statut, et l’étude était alors à refaire, l’état applicatif
    ayant changé.'
  return_loops:
  - target_step_num: '03'
    is_primary: true
    when_condition: L’étude fait émerger une problématique bloquante, ou le comité
      d’architecture rend un no-go.
    remarks_carried: Les points bloquants, les questions restées ouvertes, les scénarios
      à approfondir, les exigences du RSSI le cas échéant.
    behavior_actuel: 'L’architecte reprend son étude. Rien ne borne la reprise dans
      le temps : un sujet est resté près d’un an à ce statut.'
    behavior_ia: 'Les remarques de la restitution et du comité sont rattachées au
      DE. L’architecte reprend l’étude avec l’agent en mode « corrections » : l’agent
      intègre chaque remarque, incrémente la version et liste les sections dépendantes
      à revoir, sans les modifier sans accord. Une section à repenser entièrement
      passe par le mode « section ». L’architecte arbitre chaque reprise avant le
      nouveau passage.'
    reentry_mode: corrections
    target_sub_step_id: null
  - target_step_num: '04'
    is_primary: false
    when_condition: La remarque porte sur les exigences produit, pas sur l’architecture.
    remarks_carried: null
    behavior_actuel: null
    behavior_ia: null
    reentry_mode: corrections
    target_sub_step_id: null
  - target_step_num: '02'
    is_primary: false
    when_condition: La remarque remet en cause le besoin lui-même.
    remarks_carried: null
    behavior_actuel: null
    behavior_ia: null
    reentry_mode: corrections
    target_sub_step_id: null
