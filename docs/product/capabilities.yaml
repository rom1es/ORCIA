# ORCIA — Registre des capacités fonctionnelles (source de vérité « ce qui est en place »)
#
# Rôle : répondre à « qu'est-ce qui est livré aujourd'hui ? ». Le PRD porte l'intention (FR),
# epics.md / sprint-status.yaml portent la planification, les rapports Tech Lead portent l'historique.
# Ce fichier relie les trois aux surfaces réelles (route, routeur, UI, migration).
#
# Champs :
#   fr          : FR du PRD v2 couverts (FR-1..FR-36 ; FR-31..36 définis au §4.10 du PRD v2.0)
#   origin      : epic | adhoc
#   origin_ref  : story-key / epic ou slug du rapport Tech Lead (docs/implementation-artifacts/tech-lead-reports/)
#   status      : live | partial | planned
#   verification: docs = déduit des rapports/routeurs/manifeste, NON rejoué à l'exécution (2026-11-08)
#                 Les capacités « docs » doivent passer à « runtime » après un parcours réel (e2e / pnpm db:reset).
#   surfaces    : route SPA, préfixe API, composant @orcia/ui, migration — "?" = à confirmer
version: 1
generated: 2026-11-08
verification_default: docs

# FR-31..36 : définis au §4.10 du PRD v2.0 (2026-11-08). Bloc conservé comme index lisible.
proposed_fr:
  FR-31: "Gouvernance entreprise & Settings : habilitations RBAC/ABAC, modèles IA et routage, connecteurs & secrets, packs, wizards (Epic 8)"
  FR-32: "Coquille ergonomique, recherche ⌘K, accostage progressif Jour 0, aide contextuelle, journal d'activité (Epic 9 + ad-hoc)"
  FR-33: "Mon Assistant : gouvernance 4 niveaux, 3 vitesses (TTFT), citations déterministes, dossiers & fils collaboratifs (Epic 10)"
  FR-34: "Mes Espaces : gouvernance métier de l'espace, ADN, glossaire, routage d'artefacts (Epic 11.1-11.2)"
  FR-35: "Exposition MCP/A2A gouvernée, banc de test, atelier orcia-pack-builder (Epic 11.3-11.5)"
  FR-36: "Gestion des agents et compétences (skills) : création, exécution, MCP (ad-hoc 05/11 + 08/11)"

# Surfaces volontairement sans capacité métier propre (le contrôle `pnpm site:check` les ignore).
coverage_exemptions:
  - { surface: "/", reason: "Redirection d'accueil vers le cockpit, aucune capacité propre" }
  - { surface: health, reason: "Sonde technique /api/v1/health (infrastructure, pas une fonctionnalité)" }

