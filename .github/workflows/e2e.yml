name: e2e

# TEST-01b — E2E Playwright bi-serveur (FastAPI + Vite + PostgreSQL 18 / Redis 7.4 éphémères).
# La pile est démarrée par `apps/web/playwright.config.ts` (infra/scripts/e2e/e2e_stack.py) via
# testcontainers : le runner doit disposer de Docker (présent sur ubuntu-latest).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Dépendances Python (.venv, extras dev)
        run: uv sync --all-packages --extra dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Navigateur Playwright
        run: pnpm --filter @orcia/web exec playwright install --with-deps chromium

      - name: Pré-chargement des images de la pile éphémère
        run: |
          docker pull pgvector/pgvector:pg18
          docker pull redis:7.4-alpine

      - name: Tests E2E
        run: pnpm e2e

      - name: Rapport et traces Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
